<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATHU SEOK</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #ece5dd; }
        .header { background: #075e54; color: white; padding: 12px; text-align: center; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; font-size: 20px; }
        .welcome-msg { background: #fff3cd; color: #856404; padding: 8px; border-radius: 5px; font-size: 12px; text-align: center; margin-bottom: 8px; }
        #chat-box { height: 320px; border: 1px solid #ccc; background: #efeae2; overflow-y: scroll; padding: 10px; margin-bottom: 8px; border-radius: 0 0 8px 8px; display: flex; flex-direction: column; }
        .msg { padding: 8px 12px; margin: 4px 0; border-radius: 8px; width: fit-content; max-width: 80%; font-size: 14px; position: relative; display: flex; gap: 8px; align-items: flex-start; }
        .msg.sent { background: #dcf8c6; align-self: flex-end; flex-direction: row-reverse; }
        .msg.received { background: #ffffff; align-self: flex-start; }
        .dp-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .sender-name { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 3px; display: block; }
        .reply-quote { background: rgba(0,0,0,0.05); border-left: 3px solid #075e54; padding: 4px; font-size: 11px; margin-bottom: 4px; border-radius: 3px; }
        .ticks { font-size: 11px; margin-left: 5px; color: #888; font-weight: bold; }
        .blue-tick { color: #34b7f1 !important; }
        .reply-btn { font-size: 10px; color: #666; cursor: pointer; margin-left: 8px; text-decoration: underline; }
        .input-container { display: flex; gap: 5px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .mic-btn { background: #128c7e; }
        .attach-btn { background: #075e54; }

        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 85%; max-width: 320px; text-align: center; }
        .modal-content input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }

        #admin-panel { display: none; background: #fff; padding: 10px; border: 1px solid #ccc; margin-bottom: 10px; border-radius: 5px; font-size: 12px; }
        .user-item { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; padding: 4px; background: #f9f9f9; }
        .remove-btn { background: #ff4d4d; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 10px; }
        #reply-preview { display: none; background: #e0e0e0; padding: 5px; font-size: 12px; border-left: 3px solid #075e54; margin-bottom: 5px; justify-content: space-between; }
        .media-img { max-width: 200px; max-height: 200px; border-radius: 5px; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="modal-content">
            <h3>Ingia ATHU SEOK 💬</h3>
            <input type="text" id="usernameInput" placeholder="Andika Jina Lako...">
            <label style="font-size:12px; display:block; margin-top:5px;">Chagua Profile Picture (DP):</label>
            <input type="file" id="dpInput" accept="image/*">
            <input type="password" id="adminPinInput" placeholder="Admin PIN (Kama wewe ni Admin)">
            <button onclick="joinApp()">Ingia Chat</button>
        </div>
    </div>

    <div class="header">
        <h2>ATHU SEOK 💬</h2>
        <button id="admin-toggle-btn" style="display:none; font-size: 11px;" onclick="toggleAdminPanel()">⚙️ Settings</button>
    </div>
    
    <div class="welcome-msg">
        🙏 <b>Karibu sana kwenye ATHU SEOK.</b> Tunakushukuru kwa kutembelea na kutumia huduma yetu!
    </div>

    <div id="admin-panel">
        <b>⚙ Admin Control Panel</b>
        <button onclick="clearAllChats()" style="background:#d32f2f; margin-left: 10px; padding:4px 8px; font-size:10px;">Futa Chat Zote</button>
        <hr>
        <b>Watumiaji Waliopo:</b>
        <div id="user-list"></div>
    </div>

    <div id="reply-preview">
        <span id="reply-text">Replying to...</span>
        <b onclick="cancelReply()" style="cursor:pointer; color:red;">X</b>
    </div>

    <div id="chat-box"></div>

    <div class="input-container">
        <button id="micBtn" class="mic-btn" onclick="toggleRecording()">🎙️</button>
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📷</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="sendImage(this)">
        <input type="text" id="messageInput" placeholder="Andika ujumbe hapa...">
        <button onclick="sendMessage()">Tuma</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');
        let myUsername = "";
        let myDp = "https://via.placeholder.com/40";
        let isAdminUser = false;
        let selectedReply = null;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function joinApp() {
            const name = document.getElementById('usernameInput').value.trim();
            const pin = document.getElementById('adminPinInput').value.trim();
            const dpFile = document.getElementById('dpInput').files[0];

            if (!name) return alert("Tafadhali andika jina lako!");

            myUsername = name;

            if (dpFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    myDp = e.target.result;
                    socket.emit('join_user', { username: name, adminPin: pin, profilePic: myDp });
                };
                reader.readAsDataURL(dpFile);
            } else {
                socket.emit('join_user', { username: name, adminPin: pin, profilePic: myDp });
            }

            document.getElementById('login-modal').style.display = 'none';
        }

        socket.on('user_status', (data) => {
            isAdminUser = data.isAdmin;
            if (isAdminUser) {
                document.getElementById('admin-toggle-btn').style.display = 'inline-block';
            }
        });

        socket.on('update_user_list', (users) => {
            const userList = document.getElementById('user-list');
            userList.innerHTML = '';
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `<span><img src="${u.profilePic}" style="width:20px;height:20px;border-radius:50%;vertical-align:middle;"> ${u.username} ${u.isAdmin ? '<b>(Admin)</b>' : ''}</span>`;
                if (isAdminUser && !u.isAdmin) {
                    div.innerHTML += `<button class="remove-btn" onclick="kickUser('${u.username}')">Remove</button>`;
                }
                userList.appendChild(div);
            });
        });

        socket.on('kicked_notification', () => {
            alert("Umeondolewa kwenye chat na Admin!");
            location.reload();
        });

        socket.on('clear_chat_box', () => {
            chatBox.innerHTML = '';
        });

        socket.on('chat_message', (data) => {
            const item = document.createElement('div');
            const isMe = data.sender === myUsername;
            item.className = 'msg ' + (isMe ? 'sent' : 'received');
            item.id = 'msg-' + data.id;

            let replyHTML = data.reply ? `<div class="reply-quote"><b>${data.reply.sender}:</b> ${data.reply.text}</div>` : '';
            let contentHTML = "";

            if (data.isAudio) {
                contentHTML = `<audio controls src="${data.audioUrl}"></audio>`;
            } else if (data.isImage) {
                contentHTML = `<img src="${data.imageUrl}" class="media-img">`;
            } else {
                contentHTML = data.text;
            }

            let ticksHTML = isMe ? `<span class="ticks" id="tick-${data.id}">✓</span>` : '';

            item.innerHTML = `
                <img src="${data.senderDp || 'https://via.placeholder.com/40'}" class="dp-img">
                <div>
                    <span class="sender-name">${data.sender}</span>
                    ${replyHTML}
                    <div>${contentHTML} ${ticksHTML} <span class="reply-btn" onclick="setReply('${data.sender}', '${data.isAudio ? '🎙️ Voice' : (data.isImage ? '📷 Image' : data.text)}')">Reply</span></div>
                </div>
            `;

            if (!isMe) {
                socket.emit('message_read', data.id);
            }

            chatBox.appendChild(item);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        socket.on('message_read', (msgId) => {
            const tickElement = document.getElementById('tick-' + msgId);
            if (tickElement) {
                tickElement.textContent = '✓✓';
                tickElement.classList.add('blue-tick');
            }
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            if (input.value.trim() !== '') {
                socket.emit('chat_message', {
                    id: Date.now(),
                    text: input.value,
                    sender: myUsername,
                    senderDp: myDp,
                    reply: selectedReply,
                    isAudio: false
                });
                input.value = '';
                cancelReply();
            }
        }

        function sendImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    socket.emit('chat_message', {
                        id: Date.now(),
                        imageUrl: e.target.result,
                        sender: myUsername,
                        senderDp: myDp,
                        reply: selectedReply,
                        isImage: true
                    });
                    cancelReply();
                };
                reader.readAsDataURL(file);
            }
        }

        async function toggleRecording() {
            const micBtn = document.getElementById('micBtn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            socket.emit('chat_message', {
                                id: Date.now(),
                                audioUrl: reader.result,
                                sender: myUsername,
                                senderDp: myDp,
                                reply: selectedReply,
                                isAudio: true
                            });
                            cancelReply();
                        };
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.style.background = '#d32f2f';
                } catch (err) {
                    alert("Tafadhali ruhusu maikrofoni kurecord sauti!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.style.background = '#128c7e';
            }
        }

        function setReply(sender, text) {
            selectedReply = { sender, text };
            document.getElementById('reply-text').textContent = `Replying to ${sender}: "${text}"`;
            document.getElementById('reply-preview').style.display = 'flex';
        }

        function cancelReply() {
            selectedReply = null;
            document.getElementById('reply-preview').style.display = 'none';
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function kickUser(username) {
            if (confirm(`Unataka kumwondoa ${username}?`)) {
                socket.emit('admin_kick_user', username);
            }
        }

        function clearAllChats() {
            if (confirm("Unataka kufuta chat zote?")) {
                socket.emit('admin_clear_chats');
            }
        }
    </script>
</body>
  </html>
